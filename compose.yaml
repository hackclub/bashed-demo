services:
  postgres:
    image: postgres:18-alpine
    container_name: bashed-demo-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-bashed_demo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-bashed_demo}
    ports:
      # Bound to localhost only so the database isn't exposed on the network
      - "127.0.0.1:${POSTGRES_PORT:-5434}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      target: app
    container_name: bashed-demo-app
    restart: unless-stopped
    ports:
      - "${APP_PORT:-3001}:3000"
    # Applies pending migrations when it starts
    depends_on:
      postgres:
        condition: service_healthy
    # Nuxt reads these at runtime (NUXT_ prefix, see runtimeConfig in nuxt.config.ts)
    environment:
      NUXT_DATABASE_URL: postgresql://${POSTGRES_USER:-bashed_demo}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-bashed_demo}
      NUXT_BASHED_SECRET: ${BASHED_SECRET:?set BASHED_SECRET in .env}
      NUXT_PUBLIC_BASHED_URL: ${BASHED_URL:-https://bashed.hackclub.com}

volumes:
  postgres-data:
